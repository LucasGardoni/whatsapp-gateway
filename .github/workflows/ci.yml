name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build .exe (Windows)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o gateway.exe ./cmd/gateway

      - uses: actions/upload-artifact@v4
        with:
          name: gateway-windows-amd64
          path: gateway.exe
